name: Discord alerts

# Posts to Discord when CI, a release or the security scan fails on `main`, so a red trunk is seen
# without watching the Actions tab. Runs on `workflow_run`, which executes this file from `main`
# with access to secrets; it never checks out or runs the failing code and builds the message from
# a fixed template plus values passed through the environment (never interpolated into a script).
# Skipped when DISCORD_WEBHOOK_CI is not set. Set it with `node scripts/discord-webhook.mjs ci`,
# see docs/discord.md.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] posts a fixed message, never runs the triggering code
    workflows: [CI, Release, Security]
    types: [completed]

permissions: {}

jobs:
  alert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post the failure
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_CI is not set; skipping."
            exit 0
          fi
          payload=$(jq -n \
            --arg title "$WORKFLOW failed on main" \
            --arg url "$RUN_URL" \
            --arg desc "Commit [\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA). [Open the run]($RUN_URL)." \
            '{username: "ooxml ci", allowed_mentions: {parse: []},
              embeds: [{title: $title, url: $url, description: $desc, color: 15158332}]}')
          curl --fail --silent --show-error --retry 3 \
            -H 'content-type: application/json' -d "$payload" "$WEBHOOK" \
            || echo "::warning::Discord alert failed"
