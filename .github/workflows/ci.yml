name: CI

# What runs is decided by scripts/ci-plan.mjs from the files the change touched: a docs edit runs
# nothing, a docx change tests the affected files on as many runners as they need and checks only
# docx-viewer, and a dependency or CI-config change (or the nightly run) runs everything. Pushes to
# main are never cancelled by a later push: every commit gets its own verdict.
on:
  push:
    branches: [main]
    # Community health files change nothing CI checks. Pull requests are never filtered because
    # `ci-success` is a required check.
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full: check everything. changed: only what the commits since the base reach.'
        type: choice
        options: [full, changed]
        default: full
      base:
        description: 'Base commit for scope "changed", for example the upstream commit a fork branch started from.'
        required: false
        default: ''
      on_base:
        description: 'With scope "changed": run the same checks on the base commit instead, to see whether a failure is already there.'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *' # nightly full run: the safety net for `vitest --changed`

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  # PR plans include the whole branch, so a newer update supersedes them. Push plans cover only
  # that push: cancelling one would leave its changes unchecked by the next incremental plan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      # The commit the other jobs check out: empty (the event's own) unless a run on the base.
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - id: plan
        # Inputs reach the script through the environment, never pasted into it.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          SCOPE: ${{ inputs.scope || 'full' }}
          ON_BASE: ${{ inputs.on_base || false }}
        run: node scripts/ci-plan.mjs --event "$EVENT" --base "$BASE" --scope "$SCOPE" --on-base "$ON_BASE"

  lint:
    needs: plan
    # oxlint covers all of src/core and src/ui: run it whenever a typecheck would.
    if: fromJSON(needs.plan.outputs.plan).typecheck.strict || fromJSON(needs.plan.outputs.plan).typecheck.pptx || fromJSON(needs.plan.outputs.plan).typecheck.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      # `github` output turns each finding into an annotation on the changed line.
      - run: bun run lint --format=github

  # Repository style rules no formatter enforces (AGENTS.md, Style), on the lines the change adds.
  style:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).base != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: No em-dashes in added lines
        env:
          BASE: ${{ fromJSON(needs.plan.outputs.plan).base }}
        run: node scripts/check-em-dashes.mjs "$BASE"

  typecheck-strict:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).typecheck.strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: bun run typecheck:strict

  typecheck-pptx:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).typecheck.pptx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: bun run typecheck:pptx

  typecheck-ui:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.plan).typecheck.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - run: bun run --cwd src/ui typecheck

  # The unit suite is ~1,200 files and most of its time is spent importing the pptx area into each
  # file, so it is split across parallel runners by file (`vitest --shard`). The planner sizes the
  # matrix: one runner per ~60 affected test files on a change, six for a full run. The floor is the
  # slowest single file (the salt-less WHIRLPOOL modifyVerifier fixture, ~80s), not the shard count.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).test.run && toJSON(fromJSON(needs.plan.outputs.plan).test.shards) != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.plan).test.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run the affected tests
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          mode=$(node -p "JSON.parse(process.env.PLAN).test.mode")
          base=$(node -p "JSON.parse(process.env.PLAN).base")
          shard="--shard=$SHARD/$TOTAL"
          if [ "$mode" = "related" ]; then
            # A run on the base: the tests related to the branch's changed core sources.
            related=$(node -p "JSON.parse(process.env.PLAN).test.related.join(' ')")
            cd src/core && bunx vitest related --run $related $shard --passWithNoTests
          elif [ "$mode" = "changed" ] && [ -n "$base" ]; then
            bun run test --changed="$base" $shard --passWithNoTests
          else
            bun run test $shard
          fi

  # Build once; the package checks and the viewer checks below reuse the output.
  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: bun run build
      # The package and boundary checks only matter when the core or the UI changed; a viewer-only
      # change just needs the build output.
      - if: fromJSON(needs.plan.outputs.plan).checks.core
        run: bun run test:package
      # The packed tarball's types resolve under NodeNext and bundlers (Are the Types Wrong).
      - if: fromJSON(needs.plan.outputs.plan).checks.core
        run: node scripts/check-package-types.mjs src/core
      - if: fromJSON(needs.plan.outputs.plan).checks.core
        run: node scripts/check-core-ui-boundary.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-dist
          path: src/core/dist
          retention-days: 1
      # ooxml-ui builds against the core's `dist`, so it is built here as well: the viewers and the
      # pptx jobs need only the two builds, and start when this job ends instead of after the ui
      # job's unit tests.
      - if: fromJSON(needs.plan.outputs.plan).ui
        run: bun run --cwd src/ui build
      - if: fromJSON(needs.plan.outputs.plan).ui
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-dist
          path: src/ui/dist
          retention-days: 1

  # ooxml-ui's unit tests and package checks. The package is packed from the build job's core and
  # ui output (`dist`), the same build the viewers run on.
  ui:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.plan).checks.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - run: bun run --cwd src/ui test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - run: bun run --cwd src/ui test:package
      - run: node scripts/check-package-types.mjs src/ui --esm-only

  # The size of every published entry point. On a PR, bundle-size-comment.yml compares it with the
  # newest measurement from main and comments; on main it is that baseline. Informational: it is
  # not part of ci-success.
  bundle-size:
    needs: [plan, build]
    if: |
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      # ooxml-ui is built only when the plan needs it (`ui`); without it the comparison leaves it out.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: fromJSON(needs.plan.outputs.plan).ui
        with:
          name: ui-dist
          path: src/ui/dist
      - run: node scripts/bundle-size.mjs measure src/core src/ui > bundle-size.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # Release machinery: planner, publish guards, commit and changelog checks, the launcher and CI planner.
  scripts:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: bun run test:scripts
      - run: bun run check:changelog

  mcp:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - run: bun run test:mcp

  # The viewers that live in this repository (viewers/<name>), each verified the way it was when it
  # was a repository of its own. They resolve ooxml-ui to the workspace copy through its dist, so
  # they run on the core and ui from the build job, without waiting for the ui job's tests.
  # scripts/ci-plan.mjs picks the viewers a change can affect and the commands for each.
  viewers:
    name: viewer (${{ matrix.name }})
    needs: [plan, build]
    if: |
      !cancelled() && needs.build.result == 'success' &&
      toJSON(fromJSON(needs.plan.outputs.plan).viewers) != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).viewers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - name: Verify the viewer
        working-directory: ${{ matrix.dir }}
        env:
          VERIFY: ${{ matrix.verify }}
        run: |
          while IFS= read -r command; do
            echo "::group::$command"
            bash -e -o pipefail -c "$command"
            echo "::endgroup::"
          done <<< "$VERIFY"
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results-${{ matrix.name }}
          path: ${{ matrix.dir }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The PowerPoint viewer has more to check than the viewers job's ceiling fits: a ~20-minute unit
  # suite and a browser suite worth hours of runner time. So it gets its own jobs, laid out the way
  # pptx-viewer ran them: one build whose output the others download, a unit job per package, the
  # browser suite split by framework and shard, and the packaged-build smoke (see VIEWERS.pptx in
  # scripts/ci-plan.mjs).
  pptx-build:
    name: pptx build and checks
    needs: [plan, build]
    if: |
      !cancelled() && needs.build.result == 'success' &&
      fromJSON(needs.plan.outputs.plan).pptx.run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - name: Build the packages, typecheck and check the packed bindings
        working-directory: viewers/pptx
        run: |
          bun run build:packages
          bun run typecheck
          bun run e2e:contract
          bun run check:viewer-props
          bun run test:binding-packages
          bun run check:tree-shaking
      # The browser suite regenerates its fixture decks through the core's save pipeline, so a
      # core change that alters a save must commit the refreshed decks, or every later run
      # rewrites them and leaves the working tree dirty.
      - name: Check the generated e2e fixtures are committed
        working-directory: viewers/pptx
        run: bun run fixtures:check
      # Every package's dist, and the sources the Angular build generates, for the jobs below. Only
      # the generated files: re-extracting a tracked source would make it newer than the build, and
      # the e2e freshness guard (e2e/pptx/dist-freshness.ts) would then refuse to run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pptx-dist
          path: |
            viewers/pptx/packages/*/dist/
            viewers/pptx/packages/angular/src/internal/shared-src/
            viewers/pptx/packages/angular/src/internal/version.ts
          retention-days: 1

  pptx-test:
    name: pptx test (${{ matrix.leg }})
    needs: [plan, pptx-build]
    # The legs the change reaches: the changed packages and the ones depending on them (pptxPlan).
    if: |
      !cancelled() && needs.pptx-build.result == 'success' &&
      toJSON(fromJSON(needs.plan.outputs.plan).pptx.tests) != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.plan).pptx.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pptx-dist
          path: viewers/pptx/packages
      - name: Test ${{ matrix.leg }}
        working-directory: viewers/pptx/packages
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            # The React package again, under React 18 (the published range is ^18 || ^19).
            react18) cd react && bun run test:react18 && bun run typecheck:react18 ;;
            *) cd "$LEG" && bun run test ;;
          esac

  pptx-e2e:
    name: pptx e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ fromJSON(needs.plan.outputs.plan).pptx.e2e.total }})
    needs: [plan, pptx-build]
    # The frameworks the change reaches (pptxPlan): its own binding, the parity reference (react)
    # for shared or engine code, all five for dependencies, CI and the nightly; or, when only spec
    # files changed, just those specs on a few shards.
    if: |
      !cancelled() && needs.pptx-build.result == 'success' &&
      toJSON(fromJSON(needs.plan.outputs.plan).pptx.e2e.projects) != '[]'
    runs-on: ubuntu-latest
    # Per shard. The lever for a suite that outgrows it is the shard count, not this ceiling (see
    # the history in viewers/pptx/.github/workflows/ci.yml, which ran this suite before the move).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.plan).pptx.e2e.projects }}
        shard: ${{ fromJSON(needs.plan.outputs.plan).pptx.e2e.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pptx-dist
          path: viewers/pptx/packages
      - name: Install Chromium
        working-directory: viewers/pptx
        run: bun x playwright install --with-deps chromium
      # Two attempts, as pptx-viewer ran it: a runner-level browser crash should not fail the run.
      - name: Run the browser suite
        working-directory: viewers/pptx
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ fromJSON(needs.plan.outputs.plan).pptx.e2e.total }}
          # The changed spec files when only specs changed; empty runs every spec.
          SPECS: ${{ fromJSON(needs.plan.outputs.plan).pptx.e2e.specs }}
        run: |
          retry_args=()
          for attempt in 1 2; do
            # SPECS is a space-separated list of spec file names, split on purpose.
            # shellcheck disable=SC2086
            bun run e2e -- $SPECS --project="$PROJECT" --project="$PROJECT-headless" \
              --shard="$SHARD/$TOTAL" --workers=2 --reporter=list,html,github \
              "${retry_args[@]}" && exit 0
            status=$?
            echo "::warning::attempt $attempt of $PROJECT shard $SHARD/$TOTAL failed (exit $status)"
            # Playwright clears its output on the next run. Keep the original traces even when
            # the retry passes, so a flaky test or runner crash can still be investigated.
            evidence="ci-evidence/attempt-$attempt"
            mkdir -p "$evidence"
            for report in test-results playwright-report; do
              if [ -d "$report" ]; then cp -R "$report" "$evidence/"; fi
            done
            # Avoid repeating a whole shard when Playwright recorded the failures.
            # A crash before that report exists still retries the complete shard.
            if node -e 'try { const run = JSON.parse(require("node:fs").readFileSync("test-results/.last-run.json", "utf8")); process.exit(run.status !== "passed" && run.failedTests?.length > 0 ? 0 : 1); } catch { process.exit(1); }'; then
              retry_args=(--last-failed)
            else
              retry_args=()
            fi
            if [ "$attempt" -lt 2 ]; then sleep 15; fi
          done
          exit $status
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pptx-playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            viewers/pptx/playwright-report/
            viewers/pptx/test-results/
            viewers/pptx/ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  pptx-e2e-packaged:
    name: pptx e2e (packaged builds)
    needs: [plan, pptx-build]
    if: |
      !cancelled() && needs.pptx-build.result == 'success' &&
      fromJSON(needs.plan.outputs.plan).pptx.packaged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: src/core/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: src/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pptx-dist
          path: viewers/pptx/packages
      - name: Build the demo bundles
        run: |
          for demo in react vue angular vanilla svelte; do
            (cd "demos/pptx/demo-$demo" && bun run build)
          done
      - name: Install Chromium
        working-directory: viewers/pptx
        run: bun x playwright install --with-deps chromium
      - name: Run the packaged-build smoke
        working-directory: viewers/pptx
        run: bun run e2e:packaged -- --workers=2 --reporter=list,html,github
      - name: Preserve the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pptx-playwright-packaged
          path: |
            viewers/pptx/playwright-report/
            viewers/pptx/test-results/
          retention-days: 7

  # The viewers that are still their own repository (none today; see CONSUMERS in ci-plan.mjs),
  # linked to this change: the contract the shared elements and the format logic have to keep. It
  # reports failures on the run but is not part of `ci-success`: a viewer that is red for its own
  # reasons must not block this repository.
  consumers:
    name: external viewer (${{ matrix.name }})
    needs: [plan, build]
    if: |
      !cancelled() && needs.build.result != 'failure' &&
      toJSON(fromJSON(needs.plan.outputs.plan).consumers) != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).consumers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: ooxml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          repository: ${{ matrix.repo }}
          path: viewer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: ooxml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist
          path: ooxml/src/core/dist
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-dist
          path: ooxml/src/ui/dist
        continue-on-error: true
      - name: Build what this change did not
        run: |
          [ -d ooxml/src/core/dist ] || (cd ooxml && bun run build)
          [ -d ooxml/src/ui/dist ] || (cd ooxml/src/ui && bun run build)
      - name: Link the viewer to this checkout
        run: node ooxml/scripts/link-local.mjs viewer --no-build
      - run: ${{ matrix.install }}
        working-directory: viewer
      - run: ${{ matrix.verify }}
        working-directory: viewer

  # The single check the `main` ruleset requires. Funnelling through one job keeps branch
  # protection stable when jobs are added or renamed (a required check that no longer exists blocks
  # every PR silently). `always()` plus the explicit result test is deliberate: without it a
  # cancelled or failed dependency would let this pass. A job the planner skipped is fine.
  ci-success:
    name: ci-success
    if: always()
    needs:
      [
        plan,
        lint,
        style,
        typecheck-strict,
        typecheck-pptx,
        typecheck-ui,
        test,
        build,
        ui,
        scripts,
        mcp,
        viewers,
        pptx-build,
        pptx-test,
        pptx-e2e,
        pptx-e2e-packaged,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required job succeeded or was skipped by the plan
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A required CI job did not succeed (got: $results)."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs succeeded."
