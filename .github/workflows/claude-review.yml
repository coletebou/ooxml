name: Claude review

# Reviews every pull request with Claude Opus 5.5 on Amazon Bedrock through the official
# anthropics/claude-code-action, which posts inline comments on the changed lines. Claude returns its
# summary as structured output and the next step keeps it in ONE comment, edited in place on every
# run. It authenticates to GitHub with this run's GITHUB_TOKEN, so no GitHub App is installed,
# and to Bedrock with the API key in the AWS_BEARER_TOKEN_BEDROCK secret.
#
# Security: triggered by `pull_request` only, never `pull_request_target`, and the job also requires
# a pull request from a branch of this repository opened by its owner, a member or a collaborator,
# so a pull request from anyone else's fork never runs with the Bedrock key. Claude may only read
# the checkout, inspect the pull request and leave inline comments; the summary comment is written
# by the publishing step, not by Claude.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the pull request
      pull-requests: write # post the inline comments and the summary comment
    steps:
      - name: Check out the pull request head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review with Claude Opus 5.5
        id: review
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: us-east-1
        with:
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model global.anthropic.claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"],"additionalProperties":false}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request. Its head is checked out in the working directory with full
            history. Read the title, description and diff with `gh pr view` and `gh pr diff`, then
            read the code around every change; AGENTS.md and CLAUDE.md describe the conventions of
            this repository. This job cannot install dependencies, build or run tests, so review by
            reading the code.

            Look for defects the change introduces or exposes: wrong behavior, missed edge cases,
            regressions for existing callers, broken file formats or round trips, security problems,
            unhandled errors, tests that do not test what they claim, and missing tests for the new
            behavior. Verify every finding against the code before you report it. Skip style
            preferences unless a repository rule requires them, and do not comment only to praise.

            For each issue, post one inline comment on the changed line with
            `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Start its body
            with a priority, [P0] (blocks normal use, loses data or is a security hole) to [P3] (minor),
            then say what goes wrong, when, and how to fix it.

            Finish by returning your summary as the `summary` field of the structured output: markdown
            that starts with the line "## Claude review", followed by a one-line verdict, the findings
            by priority (or a plain statement that you found none), and what you checked. Do not post a
            summary comment yourself; the workflow publishes it. Post nothing else.

      - name: Publish the summary in one comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- claude-review-summary -->';
            let summary = '';
            try {
              summary = String(JSON.parse(process.env.STRUCTURED || '{}').summary || '').trim();
            } catch {
              summary = '';
            }
            if (!summary) {
              summary = `## Claude review\n\nThe review did not finish, so this run has no summary. See ${process.env.RUN_URL}.`;
            }
            const head = context.payload.pull_request.head.sha.slice(0, 9);
            const body = `${marker}\n${summary}\n\n<sub>Reviewed ${head}, [run](${process.env.RUN_URL})</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const ours = comments.filter((c) => c.user?.login === 'github-actions[bot]');
            const existing =
              ours.find((c) => c.body?.includes(marker)) ??
              [...ours].reverse().find((c) => c.body?.trimStart().startsWith('## Claude review'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
